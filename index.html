<!DOCTYPE html>
<html lang="pt-BR" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCMV | Cockpit & Gestão de Frotas</title>
  
  <!-- Favicon: Posto de Gasolina Vetorial Minimalista -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310B981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 22h12'/%3E%3Cpath d='M4 9h10v13H4z'/%3E%3Cpath d='M6 5h6v4H6z'/%3E%3Cpath d='M14 12h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2'/%3E%3Cpath d='M18 10c0-2.5 1-4 3-4'/%3E%3Cpath d='M21 6v3'/%3E%3C/svg%3E">
  
  <!-- Fontes de Alta Precisão -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-canvas: #07090E;
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 15px 35px -15px rgba(0, 0, 0, 0.8);
      --card-specular: rgba(255, 255, 255, 0.10);
      --input-bg: rgba(255, 255, 255, 0.03); 
      --input-border: rgba(255, 255, 255, 0.08);
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --header-bg: rgba(7, 9, 14, 0.85);
      --header-border: rgba(255, 255, 255, 0.08);
      --kpi-border: rgba(255, 255, 255, 0.06);
    }

    html.theme-light {
      --bg-canvas: #F8FAFC;
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.8) 100%);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 10px 25px -10px rgba(0, 0, 0, 0.05);
      --card-specular: rgba(255, 255, 255, 0.8);
      --input-bg: #FFFFFF;
      --input-border: rgba(0, 0, 0, 0.12);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --header-bg: rgba(248, 250, 252, 0.90);
      --header-border: rgba(0, 0, 0, 0.08);
      --kpi-border: rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .font-num {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: "tnum" 1, "zero" 1;
    }

    .titanium-glass {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 1px 0 var(--card-specular), var(--card-shadow);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .titanium-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .titanium-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    /* CLUSTER DIGITAL VW (8 BARRAS) */
    .vw-cluster-container {
      background: radial-gradient(circle at 50% 0%, #151d2f 0%, #080b12 85%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .vw-cluster-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
    }

    .vw-dash-segment {
      flex: 1;
      height: 7px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .vw-dash-segment:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    .vw-dash-segment.lit-white {
      background: #FFFFFF;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 14px rgba(255, 255, 255, 0.4);
    }
    .vw-dash-segment.lit-red {
      background: #EF4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9), 0 0 14px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body class="min-h-screen relative selection:bg-slate-500/20">

  <!-- Header Fluido (Mobile & Desktop) -->
  <header style="background: var(--header-bg); border-bottom: 1px solid var(--header-border);" class="sticky top-0 z-30 backdrop-blur-xl transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 sm:h-16 flex items-center justify-between">
      
      <!-- Logo + Título -->
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl titanium-glass flex items-center justify-center border-white/20 shadow-inner">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 text-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight leading-none">CCMV</h1>
            <span id="badgeCarroAtivo" class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 truncate max-w-[120px] sm:max-w-none">
              Carregando...
            </span>
          </div>
          <p class="text-[9px] font-medium uppercase tracking-wider hidden sm:block mt-0.5" style="color: var(--text-secondary)">
            Telemetria & Gestão de Frotas
          </p>
        </div>
      </div>

      <!-- Navegação Desktop -->
      <div class="hidden sm:flex items-center space-x-1 titanium-glass p-1 rounded-xl text-xs font-bold">
        <button onclick="navegarAba('cockpit')" id="navCockpitDesktop" class="px-4 py-1.5 rounded-lg transition-all bg-white text-slate-900 shadow-sm dark:bg-white dark:text-black">
          📊 Cockpit
        </button>
        <button onclick="navegarAba('aluguel')" id="navAluguelDesktop" class="px-4 py-1.5 rounded-lg transition-all text-slate-400 hover:text-current">
          🚘 Aluguel
        </button>
      </div>

      <!-- Ações do Topo -->
      <div class="flex items-center space-x-2">
        <button id="syncBadge" onclick="carregarDadosDaNuvem()" title="Clique para sincronizar com a planilha" class="h-9 px-3 rounded-xl titanium-glass hover:border-emerald-500/40 flex items-center space-x-2 text-xs font-num cursor-pointer transition-all">
          <span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse" id="syncDot"></span>
          <span id="syncText" class="font-bold text-[11px]">Sync</span>
        </button>

        <!-- Botão de Ajustes com Área de Toque Grande -->
        <button onclick="abrirModalConfig()" title="Preferências e Ajustes da API" class="h-9 px-3 rounded-xl titanium-glass hover:opacity-80 flex items-center space-x-1.5 text-xs font-bold cursor-pointer">
          <span>⚙️</span>
          <span class="text-[11px] font-medium">Ajustes</span>
        </button>
      </div>
    </div>

    <!-- Navegação Segmentada Mobile (Sem rolagem horizontal) -->
    <div class="px-3 pb-2.5 sm:hidden">
      <div class="titanium-glass p-1 rounded-xl flex items-center text-xs font-bold w-full">
        <button onclick="navegarAba('cockpit')" id="navCockpitMobile" class="flex-1 py-1.5 rounded-lg transition-all text-center bg-white text-slate-900 shadow-sm dark:bg-white dark:text-black">
          📊 Cockpit
        </button>
        <button onclick="navegarAba('aluguel')" id="navAluguelMobile" class="flex-1 py-1.5 rounded-lg transition-all text-center text-slate-400 hover:text-current">
          🚘 Aluguel
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6 space-y-4 sm:space-y-6">

    <!-- ========================================== -->
    <!-- VIEW 1: COCKPIT DE CONSUMO & TELEMETRIA   -->
    <!-- ========================================== -->
    <div id="viewCockpit" class="space-y-4 sm:space-y-6">
      
      <!-- Banner Resumo do Aluguel -->
      <div id="bannerAluguelResumo" onclick="navegarAba('aluguel')" class="titanium-glass p-3.5 sm:p-4 cursor-pointer hover:border-emerald-500/40 transition-all border-emerald-500/20 bg-emerald-500/[0.02]">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="flex items-center space-x-2.5">
            <span class="text-xl sm:text-2xl">🚗</span>
            <div>
              <h4 id="bannerCarroNome" class="text-xs sm:text-sm font-bold tracking-tight">Carro: Não configurado</h4>
              <p id="bannerCarroSub" class="text-[10px] font-num" style="color: var(--text-secondary)">Toque aqui para configurar franquia e datas.</p>
            </div>
          </div>
          
          <div class="grid grid-cols-3 gap-2 w-full sm:w-auto text-right font-num">
            <div class="px-2 py-1 rounded-lg bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[8px] uppercase tracking-wider block font-bold text-cyan-400">Cota/Dia</span>
              <span id="bannerKmPorDia" class="font-black text-cyan-400 text-xs sm:text-sm">-- km</span>
            </div>
            <div class="px-2 py-1 rounded-lg bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[8px] uppercase tracking-wider block font-bold" style="color: var(--text-secondary)">Saldo</span>
              <span id="bannerFranquiaRestante" class="font-black text-emerald-400 text-xs sm:text-sm">-- km</span>
            </div>
            <div class="px-2 py-1 rounded-lg bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[8px] uppercase tracking-wider block font-bold" style="color: var(--text-secondary)">Prazo</span>
              <span id="bannerDiasRestantes" class="font-black text-white text-xs sm:text-sm">-- dias</span>
            </div>
          </div>
        </div>
      </div>

      <!-- RÉPLICA DO PAINEL DIGITAL VW (8 BARRAS) -->
      <div class="vw-cluster-container p-4 sm:p-5 text-white">
        <div class="flex items-center justify-between pb-3 border-b border-white/10">
          <div>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] sm:text-xs uppercase font-extrabold tracking-widest text-slate-400">Nível do Tanque</span>
              <span class="text-[8px] sm:text-[9px] px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-num font-bold">VW Cluster</span>
            </div>
            <p class="text-[11px] sm:text-xs text-slate-300 font-num mt-0.5">
              Volume: <b id="clusterLitrosTexto" class="text-white">-- L</b> (<span id="clusterPercentualTexto" class="text-cyan-400">--%</span>) • Autonomia: <b id="clusterAutonomiaTexto" class="text-emerald-400">~-- km</b>
            </p>
          </div>
          
          <button onclick="abrirAjusteRapidoTanque()" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-white/20 text-[10px] font-bold font-num border border-white/15 transition-all">
            Calibrar
          </button>
        </div>

        <!-- 8 Traços da Foto -->
        <div class="max-w-md mx-auto pt-4 pb-1">
          <div class="flex items-center gap-1 sm:gap-1.5 px-1">
            <div class="vw-dash-segment" id="seg1" onclick="definirBarraTanque(1)" title="1/8 (Reserva)"></div>
            <div class="vw-dash-segment" id="seg2" onclick="definirBarraTanque(2)" title="2/8"></div>
            <div class="vw-dash-segment" id="seg3" onclick="definirBarraTanque(3)" title="3/8"></div>
            <div class="vw-dash-segment" id="seg4" onclick="definirBarraTanque(4)" title="4/8 (Meio tanque)"></div>
            <div class="vw-dash-segment" id="seg5" onclick="definirBarraTanque(5)" title="5/8"></div>
            <div class="vw-dash-segment" id="seg6" onclick="definirBarraTanque(6)" title="6/8"></div>
            <div class="vw-dash-segment" id="seg7" onclick="definirBarraTanque(7)" title="7/8"></div>
            <div class="vw-dash-segment" id="seg8" onclick="definirBarraTanque(8)" title="8/8 (Cheio)"></div>
          </div>

          <div class="flex items-center justify-between text-[11px] sm:text-xs font-num font-extrabold text-white px-1 mt-2">
            <span class="w-3 text-center">0</span>
            <span class="w-3 text-center text-slate-400 font-light">|</span>
            <span class="w-6 text-center">1/2</span>
            <span class="w-3 text-center text-slate-400 font-light">|</span>
            <div class="flex items-center space-x-1">
              <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 5h-1V4a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v16H4v2h16v-2h-1V7a2 2 0 0 1 2-2V4a1 1 0 0 0-2-1zm-4 4H9V5h6v4zm4 0h-2V7h2v2z"/>
              </svg>
              <span class="text-[8px] text-white">▶</span>
              <span>1</span>
            </div>
          </div>
        </div>
      </div>

      <!-- KPI HUD Compacto -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
        
        <div class="titanium-glass p-3.5 sm:p-5 relative overflow-hidden">
          <div class="flex justify-between items-start">
            <span class="text-[9px] sm:text-[10px] font-bold tracking-wider uppercase" style="color: var(--text-secondary)">Média Real</span>
            <span id="kpiBadgeTanque" class="text-[8px] font-num px-1 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-bold border border-emerald-500/20">50L</span>
          </div>
          <div class="mt-2 sm:mt-3 flex items-baseline space-x-1">
            <h2 id="kpiKmL" class="text-2xl sm:text-3xl font-extrabold tracking-tight font-num text-emerald-400">0.0</h2>
            <span class="text-[11px] font-semibold" style="
