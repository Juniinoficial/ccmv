<!DOCTYPE html>
<html lang="pt-BR" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCMV | Gestão de Consumo & Aluguel</title>
  
  <!-- Favicon: Posto de Gasolina Vetorial Minimalista -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310B981' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 22h12'/%3E%3Cpath d='M4 9h10v13H4z'/%3E%3Cpath d='M6 5h6v4H6z'/%3E%3Cpath d='M14 12h2a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2'/%3E%3Cpath d='M18 10c0-2.5 1-4 3-4'/%3E%3Cpath d='M21 6v3'/%3E%3C/svg%3E">
  
  <!-- Fontes de Alta Precisão -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-canvas: #07090E;
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.8);
      --card-specular: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(255, 255, 255, 0.03); 
      --input-border: rgba(255, 255, 255, 0.08);
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --header-bg: rgba(7, 9, 14, 0.75);
      --header-border: rgba(255, 255, 255, 0.08);
      --kpi-border: rgba(255, 255, 255, 0.06);
    }

    html.theme-light {
      --bg-canvas: #F8FAFC;
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.8) 100%);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.05);
      --card-specular: rgba(255, 255, 255, 0.8);
      --input-bg: #FFFFFF;
      --input-border: rgba(0, 0, 0, 0.14);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --header-bg: rgba(248, 250, 252, 0.85);
      --header-border: rgba(0, 0, 0, 0.08);
      --kpi-border: rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .font-num {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: "tnum" 1, "zero" 1;
    }

    .titanium-glass {
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--card-border);
      box-shadow: inset 0 1px 1px 0 var(--card-specular), var(--card-shadow);
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .titanium-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .titanium-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    .orb-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: -1; 
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden selection:bg-slate-500/20">

  <!-- Ambient Lights -->
  <div id="orb1" class="orb-glow w-[500px] h-[500px] bg-emerald-500/5 -top-40 -left-40"></div>
  <div id="orb2" class="orb-glow w-[600px] h-[600px] bg-slate-500/5 top-1/2 -right-60"></div>

  <!-- Header Fixo -->
  <header style="background: var(--header-bg); border-bottom: 1px solid var(--header-border);" class="sticky top-0 z-40 backdrop-blur-xl transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <!-- Brand & Carro Ativo Badge -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl titanium-glass flex items-center justify-center border-white/20 shadow-inner">
          <svg class="w-6 h-6 text-current" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
            <circle cx="7" cy="17" r="2"/>
            <path d="M9 17h6"/>
            <circle cx="17" cy="17" r="2"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base font-extrabold tracking-tight leading-none">CCMV</h1>
            <span id="badgeCarroAtivo" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
              Carro não definido
            </span>
          </div>
          <p class="text-[10px] font-medium uppercase tracking-wider mt-0.5" style="color: var(--text-secondary)">
            Telemetria & Gestão de Locação
          </p>
        </div>
      </div>

      <!-- Abas Principais + Ferramentas -->
      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="titanium-glass p-1 rounded-lg flex items-center space-x-1 text-xs">
          <button onclick="navegarAba('cockpit')" id="navCockpit" class="px-3 py-1 rounded font-bold transition-all bg-white text-slate-900 shadow-sm dark:bg-white dark:text-black">
            📊 Cockpit
          </button>
          <button onclick="navegarAba('aluguel')" id="navAluguel" class="px-3 py-1 rounded font-bold transition-all text-slate-400 hover:text-current">
            🚘 Aluguel
          </button>
        </div>

        <button onclick="toggleModalConfig()" title="Configurações da API" class="h-8 px-2.5 rounded-lg titanium-glass hover:opacity-80 text-xs font-semibold flex items-center space-x-1">
          <span>⚙️</span>
          <span class="hidden md:inline text-[11px]">API</span>
        </button>

        <div class="titanium-glass p-1 rounded-lg flex items-center space-x-1 text-xs">
          <button onclick="setTheme('auto')" id="btnThemeAuto" title="Auto" class="px-2 py-1 rounded font-bold">Auto</button>
          <button onclick="setTheme('light')" id="btnThemeLight" title="Claro" class="px-2 py-1 rounded font-bold">☀️</button>
          <button onclick="setTheme('dark')" id="btnThemeDark" title="Escuro" class="px-2 py-1 rounded font-bold">🌙</button>
        </div>

        <button id="syncBadge" onclick="carregarDadosDaNuvem()" title="Clique para sincronizar agora" class="h-8 px-2.5 rounded-lg titanium-glass hover:border-emerald-500/40 flex items-center space-x-1.5 text-[11px] font-num cursor-pointer transition-all">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse" id="syncDot"></span>
          <span id="syncText" class="font-medium hidden sm:inline">Sync</span>
        </button>
      </div>
    </div>
  </header>

  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- ========================================== -->
    <!-- VIEW 1: COCKPIT DE CONSUMO & TELEMETRIA   -->
    <!-- ========================================== -->
    <div id="viewCockpit" class="space-y-6">
      
      <!-- Banner Inteligente do Carro Alugado com COTA DIÁRIA AUTOMÁTICA -->
      <div id="bannerAluguelResumo" onclick="navegarAba('aluguel')" class="titanium-glass p-4 cursor-pointer hover:border-emerald-500/40 transition-all border-emerald-500/20 bg-emerald-500/[0.02]">
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
          <div class="flex items-center space-x-3">
            <span class="text-2xl">🚗</span>
            <div>
              <h4 id="bannerCarroNome" class="text-sm font-bold tracking-tight">Carro: Não configurado</h4>
              <p id="bannerCarroSub" class="text-[11px] font-num" style="color: var(--text-secondary)">Clique aqui para configurar seu contrato de locação e limites de KM.</p>
            </div>
          </div>
          
          <div class="grid grid-cols-3 gap-3 w-full md:w-auto text-right font-num">
            <div class="px-3 py-1.5 rounded-xl bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[9px] uppercase tracking-wider block font-bold text-cyan-400">Cota/Dia Restante</span>
              <span id="bannerKmPorDia" class="font-black text-cyan-400 text-sm sm:text-base">-- km/dia</span>
            </div>

            <div class="px-3 py-1.5 rounded-xl bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[9px] uppercase tracking-wider block font-bold" style="color: var(--text-secondary)">Saldo Franquia</span>
              <span id="bannerFranquiaRestante" class="font-black text-emerald-400 text-sm sm:text-base">-- km</span>
            </div>

            <div class="px-3 py-1.5 rounded-xl bg-black/10 dark:bg-white/5 border border-white/5">
              <span class="text-[9px] uppercase tracking-wider block font-bold" style="color: var(--text-secondary)">Prazo Restante</span>
              <span id="bannerDiasRestantes" class="font-black text-white text-sm sm:text-base">-- dias</span>
            </div>
          </div>
        </div>
      </div>

      <!-- KPI HUD -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        
        <div class="titanium-glass p-5 relative overflow-hidden">
          <div class="flex justify-between items-start">
            <span class="text-[10px] font-bold tracking-[0.2em] uppercase" style="color: var(--text-secondary)">Consumo Real Médio</span>
            <span class="text-[9px] font-num px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-bold border border-emerald-500/20">TANQUE CHEIO</span>
          </div>
          <div class="mt-3 flex items-baseline space-x-1.5">
            <h2 id="kpiKmL" class="text-3xl font-extrabold tracking-tight
